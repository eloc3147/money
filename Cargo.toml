[package]
authors = ["Kinnon McAlister <kinnonmcalister@gmail.com>"]
edition = "2024"
name = "money"
version = "0.3.0"

[dependencies]
# Core
color-eyre = "0.6.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }

# CLI
clap = { version = "4.5.54", features = ["derive"] }

# OS Info
dirs = "6.0.0"

# File parsing
toml = "1.1.3"
csv-async = { version = "1.3.1", default-features = false, features = [
    "tokio",
] }
encoding_rs = "0.8.35"
chrono = { version = "0.4.40", features = ["std", "clock", "serde"] }
self_cell = "1.2.0"
patricia_tree = "0.10.1"
rust_decimal = { version = "1.39.0", features = ["serde-with-str"] }

# Data store
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
] }

# GUI
# Default features: wgpu renderer, Wayland + X11, clipboard, accessibility, system fonts.
eframe = "0.37"
# Bundled monochrome emoji/icon fonts, so icons render without relying on system fonts.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_plot = "0.38"
egui_extras = { version = "0.37", features = ["datepicker"] }
image = { version = "0.25", default-features = false, features = ["png"] }
strum = { version = "0.28", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"

[profile.release]
debug = true
